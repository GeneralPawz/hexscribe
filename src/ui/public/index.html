<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hexscribe</title>
    <link rel="stylesheet" href="/ui/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎙️</text></svg>"
    />
  </head>
  <body>
    <!-- Collapsed to a column of icons; hovering or tabbing in slides out the
         labels. It overlays rather than pushing the page, because a layout that
         reflows whenever the pointer crosses it is a layout that fidgets. -->
    <nav id="rail" class="rail" aria-label="hexscribe">
      <div class="rail__brand">
        <span class="rail__mark" aria-hidden="true">⬡</span>
        <span class="rail__title">hexscribe</span>
      </div>

      <div class="rail__items">
        <button id="rail-new" type="button" class="rail__item">
          <span class="rail__icon" aria-hidden="true">✚</span>
          <span class="rail__label">New transcript</span>
        </button>

        <button id="rail-jobs-toggle" type="button" class="rail__item" aria-expanded="true" aria-controls="rail-runs">
          <span class="rail__icon" aria-hidden="true">☰</span>
          <span class="rail__label">Jobs</span>
          <span id="rail-jobs-count" class="rail__count"></span>
        </button>
        <ul id="rail-runs" class="rail__runs"></ul>

        <!-- Only while runs are picked with Ctrl+click: it belongs to the
             selection, not to the rail. -->
        <div id="rail-selection" class="rail__selection" hidden>
          <span id="rail-selected-count" class="rail__selected-count"></span>
          <button id="rail-delete" class="tool" type="button">Delete</button>
          <button id="rail-clear" class="tool" type="button">Clear</button>
        </div>
      </div>

      <div class="rail__foot">
        <span id="status" class="badge badge--muted">checking…</span>
        <button id="rail-settings" type="button" class="rail__item">
          <span class="rail__icon" aria-hidden="true">⚙</span>
          <span class="rail__label">Settings</span>
        </button>
      </div>
    </nav>

    <main>
      <section class="panel">
        <form id="form">
          <label id="drop" class="drop" for="file" tabindex="0" data-state="waiting">
            <input id="file" name="file" type="file" accept="audio/*,video/*" hidden />
            <strong id="drop-title">Drop audio here</strong>
            <span id="drop-hint" class="hint">or click to choose &middot; anything FFmpeg can open</span>
          </label>

          <!-- The other way in: name a file instead of copying it. Hidden when
               the server will not browse its own filesystem. -->
          <p id="browse-row" class="browse" hidden>
            <button id="browse" type="button" class="tool">Choose a file on this machine…</button>
            <span id="browse-note" class="browse__note">transcribes it where it is, without uploading a copy</span>
          </p>

          <div class="fields">
            <label>
              Language
              <input id="language" type="text" value="de" size="4" placeholder="auto" />
            </label>
            <label>
              Model
              <select id="model"></select>
            </label>
            <label>
              Task
              <select id="task">
                <option value="transcribe">Transcribe</option>
                <option value="translate">Translate to English</option>
              </select>
            </label>
            <label class="check" title="Runs on the CPU and takes several times as long as the transcription">
              <input id="diarize" type="checkbox" />
              Identify speakers
            </label>
            <label class="check" title="Rejoin sentences the decoder split at a window boundary">
              <input id="merge" type="checkbox" checked />
              Merge split sentences
            </label>
            <!-- Only useful while this tab exists; the job itself survives
                 without it. Hidden entirely where the browser has no
                 notifications to give. -->
            <label id="notify-field" class="check" title="Show progress and completion in the Windows notification centre. The tab must stay open.">
              <input id="notify" type="checkbox" />
              Notify me
            </label>
            <button id="submit" type="submit" disabled>Transcribe</button>
          </div>
        </form>

        <p id="error" class="error" hidden></p>

      </section>

      <section id="result" class="panel" hidden>
        <div class="result-bar">
          <span id="summary" class="summary"></span>
          <div class="actions">
            <span id="edited" class="badge badge--muted" hidden>edited</span>
            <button id="undo" type="button" disabled>Undo</button>
            <button id="speakers" type="button">Speakers</button>
            <button type="button" data-copy>Copy text</button>
            <button id="download" type="button">Download…</button>
          </div>
        </div>
        <!-- Only when part of the audio could not be decoded. Not an error:
             the transcript is good, and a little of it is missing. -->
        <p id="damage" class="damage" hidden></p>

        <audio id="audio" class="player" controls preload="metadata" hidden></audio>

        <!-- The shape of the recording: one band per section, drawn to scale,
             with the playhead on it. Empty until somebody names a stretch, and
             hidden while it is, because a bar with nothing on it says nothing
             an hour of flat grey did not already say. -->
        <div id="timeline" class="timeline" aria-label="Sections" hidden></div>

        <!-- Only present while rows are selected: it belongs to the selection,
             not to the page. -->
        <div id="toolbar" class="toolbar" hidden>
          <span id="toolbar-count" class="toolbar__count"></span>
          <button id="merge-selected" class="tool tool--primary" type="button">Merge</button>
          <button id="speaker-selected" class="tool" type="button">Speaker</button>
          <button id="clear-selected" class="tool" type="button">Clear</button>
        </div>

        <ol id="segments" class="segments"></ol>
      </section>
    </main>

    <!-- One panel, many contents: a speaker's identity, the download options,
         whatever comes next. Hidden until something asks for it. -->
    <aside id="aside" class="aside" aria-label="Details" hidden></aside>

    <!-- The drawer along the bottom: where in this recording is everything
         about X. Collapsed to a handle until it is asked for, because the
         answer to that question is a list and a list needs width, not a
         column. -->
    <section id="drawer" class="drawer" aria-label="Find in this transcript">
      <button id="drawer-handle" class="drawer__handle" type="button"
              aria-expanded="false" aria-controls="drawer-body">
        <span class="drawer__grip" aria-hidden="true"></span>
        <span id="drawer-label" class="drawer__label">Tags and speakers</span>
      </button>
      <div id="drawer-tabs" class="drawer__tabs" role="tablist" hidden></div>
      <div id="drawer-body" class="drawer__body" hidden></div>
    </section>

    <!-- A real <dialog>: the browser already traps focus, closes on Escape and
         renders a backdrop, and reimplementing that is a lot of code to arrive
         back where the platform started. -->
    <dialog id="modal" class="modal"></dialog>

    <script type="module" src="/ui/js/main.js"></script>
  </body>
</html>
